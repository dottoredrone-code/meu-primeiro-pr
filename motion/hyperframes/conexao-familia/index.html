<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Teste das skills de motion: mesma paleta do teste do Remotion, fontes do Windows. */
      :root {
        --fundo-1: #0f2a3d;
        --fundo-2: #1d4e5f;
        --dourado: #f2d16b;
        --tinta: #ffffff;
        --fonte: "Segoe UI", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fundo-1);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--fonte);
        background: linear-gradient(180deg, var(--fundo-1) 0%, var(--fundo-2) 60%, #6b6a3a 100%);
      }
      #bloco {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      .palavra {
        color: var(--tinta);
        font-size: 110px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.05;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      #p3 {
        color: var(--dourado);
        font-size: 124px;
      }
      #linha {
        margin-top: 30px;
        height: 10px;
        width: 520px;
        border-radius: 5px;
        background: var(--dourado);
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div id="bloco" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="p1" class="palavra">Conexão</div>
        <div id="p2" class="palavra">Família</div>
        <div id="p3" class="palavra">Torralles</div>
        <div id="linha"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Palavras entram uma a uma, de baixo para cima.
      tl.fromTo(
        ".palavra",
        { opacity: 0, y: 80 },
        { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.6)", stagger: 0.5 },
        0.3
      );
      // Linha dourada cresce do centro.
      tl.fromTo("#linha", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 2.3);
      // Leve aproximação contínua (efeito de câmera).
      tl.fromTo("#bloco", { scale: 1 }, { scale: 1.06, duration: 10, ease: "none" }, 0);
      // Saída suave no último segundo.
      tl.to("#bloco", { opacity: 0, duration: 0.9, ease: "power2.in" }, 9.0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
