# Cadeias de fallback do Torralles Studio.
#
# [provedores.X] define um provedor reutilizável.
# [tarefas.Y].cadeia lista os provedores em ordem de preferência: o roteador
# tenta o primeiro e, se faltar chave ou der erro, passa para o próximo.
#
# custo_usd / custo_usd_por_segundo: estimativas usadas pelo teto de custo (D20).
# Nomes de modelos mudam com frequência: confira na documentação de cada
# serviço e ajuste aqui, sem mexer no código. Última revisão: 16/10/2026 (K01).
# Verificação mensal no cartão recorrente KR1 do KANBAN.md.

[roteador]
repeticoes = 1      # novas tentativas no mesmo provedor em erro temporário
espera_base = 1.0   # segundos; dobra a cada repetição
teto_custo_usd = 1.50  # por execução/vídeo (D20); provedores pagos que não couberem são pulados

[banco]
# Banco local (SQLite, D6): projetos, tentativas, custo, retomada e cache. Fica fora do Git.
caminho = "dados/torralles.db"

[perfis]
# Perfis por projeto (D11): um <id>.toml por projeto. Fora do Git; modelo em config/perfil_modelo.toml.
pasta = "dados/perfis"

[seguranca]
# Arquivos devolvidos pelos provedores só são baixados destes domínios (D8).
dominios_download = ["fal.media", "storage.googleapis.com", "image.pollinations.ai"]
tamanho_maximo_download_mb = 300

# ---------------------------------------------------------------- texto

[provedores.deepseek_chat]
familia = "deepseek"  # juiz nunca é da mesma família de quem gerou
custo_usd = 0.001  # estimativa (revisar no KR1)
classe = "openai_compat"
base_url = "https://api.deepseek.com"
modelo = "deepseek-flash"   # V4.1-Flash; "deepseek-chat" foi aposentado em 24/07/2026
chave_env = "DEEPSEEK_API_KEY"

[provedores.deepseek_reasoner]
familia = "deepseek"  # juiz nunca é da mesma família de quem gerou
custo_usd = 0.003  # estimativa (revisar no KR1)
classe = "openai_compat"
base_url = "https://api.deepseek.com"
modelo = "deepseek-v4-pro"  # "deepseek-reasoner" foi aposentado; se indisponível, a cadeia segue
chave_env = "DEEPSEEK_API_KEY"
timeout = 300

[provedores.claude]
familia = "anthropic"  # juiz nunca é da mesma família de quem gerou
custo_usd = 0.02  # estimativa (revisar no KR1)
classe = "anthropic"
modelo_env = "CLAUDE_MODEL"   # defina o modelo no .env
chave_env = "ANTHROPIC_API_KEY"

[provedores.gemini_flash]
familia = "google"  # juiz nunca é da mesma família de quem gerou
custo_usd = 0.003  # estimativa (revisar no KR1)
classe = "gemini_texto"
modelo = "gemini-3.6-flash"  # estável; "gemini-2.5-flash" desligado em 16/10/2026
chave_env = "GEMINI_API_KEY"

[provedores.openai_mini]
familia = "openai"  # juiz nunca é da mesma família de quem gerou
custo_usd = 0.003  # estimativa (revisar no KR1)
classe = "openai_compat"
base_url = "https://api.openai.com/v1"
modelo = "gpt-5.4-mini"  # substituto indicado do snapshot gpt-5-mini (desliga 11/12/2026)
chave_env = "OPENAI_API_KEY"

[provedores.openrouter_gratis]
familia = "deepseek"  # família do MODELO, não do serviço: atualize junto quando trocar o modelo
custo_usd = 0  # estimativa (revisar no KR1)
# Modelos ":free" do OpenRouter mudam com frequência: openrouter.ai/models?q=free
classe = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
modelo = "deepseek/deepseek-chat-v3.1:free"
chave_env = "OPENROUTER_API_KEY"

[provedores.ollama_local]
familia = "local"  # juiz nunca é da mesma família de quem gerou
# Roda no seu computador: instale o Ollama e baixe o modelo (ollama pull qwen2.5:7b).
classe = "openai_compat"
base_url_env = "OLLAMA_BASE_URL"   # ex.: http://localhost:11434/v1
modelo = "qwen2.5:7b"
timeout = 600

# ---------------------------------------------------------------- busca

[provedores.tavily]
custo_usd = 0  # estimativa (revisar no KR1)
classe = "tavily"
chave_env = "TAVILY_API_KEY"

[provedores.brave]
custo_usd = 0.005  # estimativa (revisar no KR1)
classe = "brave"
chave_env = "BRAVE_API_KEY"

