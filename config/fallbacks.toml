[provedores.ken_burns]
# Zoom local com FFmpeg: gratuito, garante que sempre sai um vídeo.
classe = "ken_burns"

# ================================================================ tarefas

[tarefas.ideias]
cadeia = ["deepseek_chat", "gemini_flash", "claude", "openai_mini", "openrouter_gratis", "ollama_local"]

[tarefas.roteiro]
cadeia = ["deepseek_chat", "claude", "gemini_flash", "openai_mini", "openrouter_gratis", "ollama_local"]

[tarefas.pesquisa]
# Síntese dos resultados de busca: modelo que "raciocina" primeiro.
cadeia = ["deepseek_reasoner", "deepseek_chat", "gemini_flash", "claude", "openrouter_gratis", "ollama_local"]

[tarefas.juiz]
# Juízes de texto (roteiro, pesquisa). Imagem e vídeo usam juízes com visão (K06, K17).
cadeia = ["claude", "gemini_flash", "openai_mini", "deepseek_chat", "openrouter_gratis", "ollama_local"]

[tarefas.revisao]
cadeia = ["claude", "deepseek_reasoner", "gemini_flash", "openai_mini"]

[tarefas.busca]
cadeia = ["tavily", "brave"]

[tarefas.imagem]
cadeia = ["nano_banana", "fal_flux", "openai_imagem", "pollinations"]

[tarefas.voz]
cadeia = ["elevenlabs", "openai_voz", "edge_tts"]

[tarefas.video]
cadeia = ["fal_kling", "fal_wan", "ken_burns"]

# ================================================================ avaliação (régua 0–100, D15)
# Pesos e pisos da spec 03 convertidos para 0–100. Faixas numéricas serão recalibradas com a base
# de referência (spec 09/12, cartões K13–K14).

[avaliacao.loop]
# Loop de correção (spec 01): refaz só a peça reprovada. Ao estourar, fica a melhor tentativa + revisar_manual.
tentativas_por_provedor = 2   # reprovou 2 vezes no mesmo provedor → passa ao próximo da cadeia
tentativas_totais = 4         # por peça; o teto de custo ([roteador]) também encerra o loop

[avaliacao.roteiro]
nota_minima = 70
num_juizes = 1
divergencia_maxima = 20

[avaliacao.roteiro.criterios]
gancho    = { peso = 25, piso = 60, descricao = "Os 3 primeiros segundos prendem a atenção com pergunta concreta, fato surpreendente, promessa ou ação, sem enrolar" }
precisao  = { peso = 20, piso = 70, descricao = "Nenhuma contradição com a pesquisa, o briefing ou os fatos travados; nada inventado" }
aderencia = { peso = 15, descricao = "Fala do tema pedido, sem fugir do assunto" }
clareza   = { peso = 15, descricao = "Frases curtas e naturais de ouvir, fáceis de entender de primeira" }
ritmo     = { peso = 15, descricao = "Início, desenvolvimento e fechamento; viradas do tipo 'mas… então…'; nenhuma cena morta" }
cta       = { peso = 10, descricao = "Fechamento com chamada para ação clara" }

[avaliacao.roteiro.automatico]
# Lidos por Avaliador.parametros_automaticos("roteiro") e passados para checar_roteiro().
palavras_por_segundo = 2.5
tolerancia_duracao = 0.20
folga_narracao = 1.10
