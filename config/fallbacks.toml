# Cadeias de fallback do Torralles Studio.
#
# [provedores.X] define um provedor reutilizável.
# [tarefas.Y].cadeia lista os provedores em ordem de preferência: o roteador
# tenta o primeiro e, se faltar chave ou der erro, passa para o próximo.
#
# Nomes de modelos mudam com frequência: confira na documentação de cada
# serviço e ajuste aqui, sem mexer no código. Última revisão: 16/10/2026 (K01).
# Verificação mensal no cartão recorrente KR1 do KANBAN.md.

[roteador]
repeticoes = 1      # novas tentativas no mesmo provedor em erro temporário
espera_base = 1.0   # segundos; dobra a cada repetição

# ---------------------------------------------------------------- texto

[provedores.deepseek_chat]
classe = "openai_compat"
base_url = "https://api.deepseek.com"
modelo = "deepseek-flash"   # V4.1-Flash; "deepseek-chat" foi aposentado em 24/07/2026
chave_env = "DEEPSEEK_API_KEY"

[provedores.deepseek_reasoner]
classe = "openai_compat"
base_url = "https://api.deepseek.com"
modelo = "deepseek-v4-pro"  # "deepseek-reasoner" foi aposentado; se indisponível, a cadeia segue
chave_env = "DEEPSEEK_API_KEY"
timeout = 300

[provedores.claude]
classe = "anthropic"
modelo_env = "CLAUDE_MODEL"   # defina o modelo no .env
chave_env = "ANTHROPIC_API_KEY"

[provedores.gemini_flash]
classe = "gemini_texto"
modelo = "gemini-3.6-flash"  # estável; "gemini-2.5-flash" desligado em 16/10/2026
chave_env = "GEMINI_API_KEY"

[provedores.openai_mini]
classe = "openai_compat"
base_url = "https://api.openai.com/v1"
modelo = "gpt-5.4-mini"  # substituto indicado do snapshot gpt-5-mini (desliga 11/12/2026)
chave_env = "OPENAI_API_KEY"

[provedores.openrouter_gratis]
# Modelos ":free" do OpenRouter mudam com frequência: openrouter.ai/models?q=free
classe = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
modelo = "deepseek/deepseek-chat-v3.1:free"
chave_env = "OPENROUTER_API_KEY"

[provedores.ollama_local]
# Roda no seu computador: instale o Ollama e baixe o modelo (ollama pull qwen2.5:7b).
classe = "openai_compat"
base_url_env = "OLLAMA_BASE_URL"   # ex.: http://localhost:11434/v1
modelo = "qwen2.5:7b"
timeout = 600

# ---------------------------------------------------------------- busca

[provedores.tavily]
classe = "tavily"
chave_env = "TAVILY_API_KEY"

[provedores.brave]
classe = "brave"
chave_env = "BRAVE_API_KEY"

# ---------------------------------------------------------------- imagem

[provedores.nano_banana]
classe = "gemini_imagem"
modelo = "gemini-3.1-flash-image"  # Nano Banana 2; "gemini-2.5-flash-image" desligado em 02/10/2026
chave_env = "GEMINI_API_KEY"

[provedores.fal_flux]
classe = "fal_imagem"
modelo = "fal-ai/flux/schnell"
chave_env = "FAL_KEY"

[provedores.openai_imagem]
classe = "openai_imagem"
modelo = "gpt-image-2"  # "gpt-image-1" desliga em 23/10/2026
chave_env = "OPENAI_API_KEY"
timeout = 300

[provedores.pollinations]
# Gratuito e sem chave; qualidade e disponibilidade variam.
classe = "pollinations"
timeout = 180

# ---------------------------------------------------------------- voz

[provedores.elevenlabs]
classe = "elevenlabs"
modelo = "eleven_multilingual_v2"
voz_id = "21m00Tcm4TlvDq8ikWAM"
chave_env = "ELEVENLABS_API_KEY"

[provedores.openai_voz]
classe = "openai_voz"
modelo = "gpt-4o-mini-tts"
voz = "alloy"
chave_env = "OPENAI_API_KEY"

[provedores.edge_tts]
classe = "edge_tts"
voz = "pt-BR-FranciscaNeural"

# ---------------------------------------------------------------- vídeo

[provedores.fal_kling]
classe = "fal_video"
modelo = "fal-ai/kling-video/v3/standard/image-to-video"
campo_imagem = "start_image_url"  # o Kling v3 usa este nome de parâmetro
chave_env = "FAL_KEY"
timeout = 900

[provedores.fal_wan]
classe = "fal_video"
modelo = "fal-ai/wan-25-preview/image-to-video"
chave_env = "FAL_KEY"
enviar_duracao = false
timeout = 900

[provedores.ken_burns]
# Zoom local com FFmpeg: gratuito, garante que sempre sai um vídeo.
classe = "ken_burns"

# ================================================================ tarefas

[tarefas.ideias]
cadeia = ["deepseek_chat", "gemini_flash", "claude", "openai_mini", "openrouter_gratis", "ollama_local"]

[tarefas.roteiro]
cadeia = ["deepseek_chat", "claude", "gemini_flash", "openai_mini", "openrouter_gratis", "ollama_local"]

[tarefas.pesquisa]
# Síntese dos resultados de busca: modelo que "raciocina" primeiro.
cadeia = ["deepseek_reasoner", "deepseek_chat", "gemini_flash", "claude", "openrouter_gratis", "ollama_local"]

[tarefas.revisao]
cadeia = ["claude", "deepseek_reasoner", "gemini_flash", "openai_mini"]

[tarefas.busca]
cadeia = ["tavily", "brave"]

[tarefas.imagem]
cadeia = ["nano_banana", "fal_flux", "openai_imagem", "pollinations"]

[tarefas.voz]
cadeia = ["elevenlabs", "openai_voz", "edge_tts"]

[tarefas.video]
cadeia = ["fal_kling", "fal_wan", "ken_burns"]
